  <polygon points="0,180 60,180 -260,450 -400,450" fill="#e2483d"/>
  <polygon points="60,180 120,180 -60,450 -220,450" fill="#5f9150"/>
  <polygon points="120,180 180,180 120,450 -40,450" fill="#f2bf5a"/>
  <polygon points="180,180 240,180 300,450 140,450" fill="#5f9150"/>
  <polygon points="240,180 300,180 470,450 310,450" fill="#e86aa0"/>
  <polygon points="300,180 360,180 640,450 480,450" fill="#5f9150"/>
  <polygon points="360,180 420,180 820,450 660,450" fill="#ff6b35"/>
  <polygon points="420,180 480,180 1000,450 840,450" fill="#5f9150"/>
  <polygon points="480,180 540,180 1180,450 1020,450" fill="#8a5bc4"/>
  <!-- foreground tulips -->
  <g transform="translate(40 380)" fill="#e2483d"><use href="#tulip"/></g>
  <g transform="translate(78 396) scale(.9)" fill="#f2bf5a"><use href="#tulip"/></g>
  <g transform="translate(118 384)" fill="#e86aa0"><use href="#tulip"/></g>
  <g transform="translate(470 392)" fill="#ff6b35"><use href="#tulip"/></g>
  <g transform="translate(512 380) scale(1.1)" fill="#e2483d"><use href="#tulip"/></g>
